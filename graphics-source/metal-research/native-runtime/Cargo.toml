[package]
name = "iosgpu-metal"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ash = "=0.38.0"
libc = "=0.2.191"
metal2vulkan-air = { path = "/home/ubuntu/metal-build/metal2vulkan/crates/metal2vulkan-air" }
metal2vulkan = { path = "/home/ubuntu/metal-build/metal2vulkan/crates/metal2vulkan" }
metal2vulkan-runtime = { path = "/home/ubuntu/metal-build/metal2vulkan/crates/metal2vulkan-runtime" }

[profile.release]
debug = 0
strip = "symbols"
lto = false
incremental = false
codegen-units = 16

[package.metadata.provenance]
upstream-revision = "a2c440b8bcdcf20d34aa1694b61ae22c2a7ea68b"
upstream-license-choice = "LGPL-3.0-or-later"
